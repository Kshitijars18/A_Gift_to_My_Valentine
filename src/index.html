<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VProject</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
 <audio id="bg-music" autoplay loop>
    <source src="assets/WithYou1.mp3" type="audio/mp4">
    Your browser does not support the audio element.
  </audio>
  <app-root></app-root>
    <script>
    // Optional: unmute and play after first user interaction (bypass autoplay restrictions)
    const audio = document.getElementById('bg-music');
    audio.volume = 0.5; // set volume (0 to 1)
    document.body.addEventListener('click', () => {
      audio.play().catch(() => console.log('User interaction required to play audio'));
    }, { once: true });
  </script>

  <style>
    /* Hide the audio element so it's invisible */
    #bg-music {
      display: none;
    }
  </style>
</body>
</html>
